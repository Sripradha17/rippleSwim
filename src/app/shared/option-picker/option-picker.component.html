<div class="option-picker" [class.option-picker-2col]="columns === 2" role="tablist" [attr.aria-label]="ariaLabel">
  @for (option of options; track option.id) {
    <button
      type="button"
      class="option-picker-button"
      [class.is-active]="selectedId === option.id"
      [attr.aria-selected]="selectedId === option.id"
      (click)="selected.emit(option.id)"
    >
      @if (option.badge) {
        <span class="option-picker-badge">{{ option.badge }}</span>
      }
      <span class="option-picker-copy">
        <strong>{{ option.label }}</strong>
        <span>{{ option.detail }}</span>
      </span>
    </button>
  }
</div>
